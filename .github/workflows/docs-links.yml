name: External documentation links

# Relative links and every documentation example are checked in CI, where a
# failure must block a merge. Reaching third-party hosts cannot block a merge
# without making the build depend on someone else's uptime, so external URLs
# are checked here on a schedule instead.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: Resolve every external URL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check external links
        run: tools/check-links.sh --external
