name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and the documentation courts are platform-independent, so they
  # run once rather than once per matrix cell.
  style:
    name: Formatting and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAVA_OPTS: -Xms1G -Xmx3G -Xss6M -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt -Djava.awt.headless=true -Dsbt.supershell=false scalafmtCheckAll
      - name: Compile every documentation example and re-render the gallery
        run: tools/check-docs.sh

  # Every supported Scala line on every supported JDK, for the JVM and for
  # Scala.js. `testAll` names every module explicitly, so a cell that
  # passes has compiled every backend and run its unit, law, conformance,
  # differential, fuzz, golden, and performance-gate suites.
  test:
    name: Scala ${{ matrix.scala }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scala:
          - "3.3.8"
          - "3.9.0"
        java:
          - "17"
          - "21"
          - "25"
    env:
      JAVA_OPTS: -Xms1G -Xmx3G -Xss6M -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Test every module on the JVM and Scala.js
        run: >-
          sbt -Djava.awt.headless=true -Dsbt.supershell=false
          "++${{ matrix.scala }}" testAll
      # testAll links Scala.js with fastLinkJS. A production bundle is linked with fullLinkJS, which
      # can behave differently (bd-01M41R5BTCMQ5R0NPGAZ0S504K hung every plot compile). The smoke
      # program is pinned to the published Scala line, so one cell runs it.
      - name: Run a plot compile in a fullLinkJS bundle
        if: matrix.scala == '3.3.8' && matrix.java == '17'
        run: bash tools/check-fulllink.sh
      # A failed visual golden writes expected/actual/difference PNGs. Keep them: they are the only
      # way to review a Linux render, and a host-pinned golden's Linux copy is taken from here.
      - name: Keep visual golden failures for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-scala-${{ matrix.scala }}-jdk-${{ matrix.java }}
          path: target/golden-failures
          if-no-files-found: ignore

  # Keep JavaFX runtime qualification separate from the full Scala/JDK matrix:
  # the suite is runtime-sensitive, while all other module courts already run above.
  javafx-runtime:
    name: OpenJFX ${{ matrix.javafx }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - javafx: "21.0.5"
            java: "21"
          - javafx: "27"
            java: "25"
    env:
      JAVA_OPTS: -Xms1G -Xmx3G -Xss6M -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Test the JavaFX library and trace example
        run: >-
          sbt -Djava.awt.headless=true -Dsbt.supershell=false
          -Dintaglio.javafx.version=${{ matrix.javafx }}
          javafxJVM/test javafxExample/test

  # The compatibility gate builds the exact baseline from source in an isolated
  # sandbox, so it runs once on the published Scala line rather than per cell.
  compatibility:
    name: Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_OPTS: -Xms1G -Xmx4G -Xss6M -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Check compatibility against the exact Intaglio baseline
        run: tools/check-compatibility.sh
